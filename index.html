
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
<style>
:root{
  --color-background-primary:#ffffff;
  --color-background-secondary:#f4f1ea;
  --color-text-primary:#1a1a1a;
  --color-text-secondary:#6b6b5f;
  --color-border-primary:#d8d5cb;
  --color-border-secondary:#c9c6ba;
  --color-border-tertiary:#e3e0d6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f1ea;padding:1.5rem;display:flex;justify-content:center;position:relative}
.bg-scene{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#f4f1ea;transition:opacity .3s}
.bg-scene::after{content:'';position:absolute;inset:0;background:rgba(244,241,234,0.4)}
.bg-scene img{width:100%;height:100%;object-fit:cover;display:block}
.page{display:flex;flex-direction:column;align-items:center;gap:1rem;width:100%}
.site-logo{display:flex;flex-direction:column;align-items:center;gap:0.5rem;max-width:640px;width:100%}
.site-logo .badge-logo{width:100%;max-width:520px;height:auto}
.site-tagline{color:var(--color-text-secondary);font-size:13px;text-align:center}
.app-shell{display:flex;gap:1.5rem;align-items:flex-start;justify-content:center;width:100%}
.side-panel{width:240px;flex-shrink:0;display:none}
.side-timeline-panel{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:1rem 1.25rem;max-height:calc(100vh - 3rem);overflow-y:auto;width:320px}
.side-info-panel{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:1rem 1.25rem;max-height:calc(100vh - 3rem);overflow-y:auto;width:300px;font-size:12px;color:var(--color-text-secondary);line-height:1.5}
.info-block{margin-bottom:14px;padding-bottom:14px;border-bottom:0.5px solid var(--color-border-tertiary)}
.info-block:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.info-block-title{font-size:13px;font-weight:600;color:var(--color-text-primary);margin-bottom:4px}
.side-timeline-header{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-text-secondary);margin-bottom:0.75rem;padding-bottom:0.5rem;border-bottom:0.5px solid var(--color-border-tertiary)}
#side-timeline-slot #tab-timeline{padding:0;display:block}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg,12px);overflow:hidden;max-width:640px;width:100%}
.style-row{display:grid;grid-template-columns:repeat(5,1fr);gap:0}
@media(max-width:560px){.style-row{grid-template-columns:repeat(3,1fr)}}
.style-btn{padding:1rem 1rem;border:none;background:var(--color-background-secondary);color:var(--color-text-secondary);font-size:14px;font-weight:700;letter-spacing:0.02em;cursor:pointer;border-bottom:2px solid var(--color-border-tertiary);border-right:0.5px solid var(--color-border-tertiary);transition:all .15s}
.style-btn:last-child{border-right:none}
.style-btn:hover{background:var(--color-border-tertiary)}
.style-btn.active{background:#B3202A;color:#fff;border-bottom-color:#B3202A;box-shadow:inset 0 -3px 0 rgba(0,0,0,0.15)}
.flour-row{padding:0.75rem 1.5rem;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap}
.flour-row label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-text-secondary);white-space:nowrap}
.flour-btns{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{font-size:12px;padding:4px 12px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;transition:all .15s}
.fbtn.active{background:#1a1a1a;color:#f5f0e8;border-color:#1a1a1a}
.controls{padding:1rem 1.5rem;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
.ctrl-group label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-text-secondary);display:block;margin-bottom:5px}
.ctrl-row{display:flex;align-items:center;gap:8px}
.ctrl-row input[type=range]{flex:1;min-width:0;accent-color:#1a1a1a}
.ctrl-val{font-size:15px;font-weight:500;color:var(--color-text-primary);min-width:2ch;text-align:right}
.ctrl-unit{font-size:11px;color:var(--color-text-secondary)}
.ferment-row{padding:0.75rem 1.5rem;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap}
.ferment-row label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-text-secondary);white-space:nowrap}
.yeast-note{margin-left:auto;font-size:11px;color:var(--color-text-secondary);font-style:italic}
.total-bar{padding:0.75rem 1.5rem;background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary);display:flex;gap:1.25rem;align-items:baseline;flex-wrap:wrap}
.total-bar .label{font-size:11px;color:var(--color-text-secondary)}
.total-bar .big{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.total-bar .sep{color:var(--color-border-secondary);font-size:14px;align-self:center}
.tabs{display:flex;border-bottom:0.5px solid var(--color-border-tertiary)}
.tab{flex:1;padding:0.9rem 0.6rem;font-size:14px;font-weight:700;letter-spacing:0.02em;text-align:center;cursor:pointer;background:var(--color-background-secondary);color:var(--color-text-secondary);border:none;border-right:0.5px solid var(--color-border-tertiary);border-bottom:3px solid transparent;transition:all .15s}
.tab:hover{background:var(--color-border-tertiary)}
.tab:last-child{border-right:none}
.tab.active{background:var(--color-background-primary);color:var(--color-text-primary);border-bottom-color:#B3202A}
.tab-content{display:none;padding:1.25rem 1.5rem}
.tab-content.active{display:block}
.recipe-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.stage{border:0.5px solid var(--color-border-tertiary);border-radius:8px;padding:0.875rem 1rem;position:relative}
.stage.full{grid-column:1/-1}
.badge{font-size:10px;font-weight:500;padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:0.75rem}
.badge-amber{background:#FAEEDA;color:#633806}
.badge-teal{background:#E1F5EE;color:#085041}
.badge-blue{background:#E6F1FB;color:#0C447C}
.badge-red{background:#FAEAEA;color:#7C1D1D}
.badge-grey{background:#F0F0F0;color:#444}
.section-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-text-secondary);margin-bottom:0.5rem}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.row:last-child{border-bottom:none}
.row .name{font-size:13px;color:var(--color-text-secondary)}
.row .amount{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.timing{display:flex;gap:6px;margin-top:0.75rem;padding-top:0.75rem;border-top:0.5px solid var(--color-border-tertiary)}
.timing-item{flex:1;text-align:center;background:var(--color-background-secondary);border-radius:6px;padding:5px 4px}
.timing-item .t-val{font-size:12px;font-weight:500;color:var(--color-text-primary);display:block}
.timing-item .t-label{font-size:10px;color:var(--color-text-secondary)}
.steps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:0.5rem}
.step{background:var(--color-background-secondary);border-radius:6px;padding:7px 6px;text-align:center}
.step .n{font-size:10px;color:var(--color-text-secondary);margin-bottom:2px}
.step .v{font-size:12px;font-weight:500;color:var(--color-text-primary)}
.note{grid-column:1/-1;font-size:11px;color:var(--color-text-secondary);padding-top:0.75rem;border-top:0.5px solid var(--color-border-tertiary);line-height:1.6}
.diff-tag{font-size:10px;background:#FFF3CD;color:#7A4F00;padding:1px 5px;border-radius:3px;margin-left:4px}
.tl-controls{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.tl-ctrl label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-text-secondary);display:block;margin-bottom:5px}
.tl-ctrl select,.tl-ctrl input{width:100%;padding:6px 10px;border:0.5px solid var(--color-border-secondary);border-radius:6px;font-size:13px;background:var(--color-background-primary);color:var(--color-text-primary)}
.day-block{margin-bottom:1.25rem}
.day-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-secondary);margin-bottom:0.5rem;padding-bottom:0.25rem;border-bottom:0.5px solid var(--color-border-tertiary)}
.events{display:flex;flex-direction:column;gap:6px}
.event{display:flex;align-items:flex-start;gap:12px;padding:8px 12px;border-radius:8px;border:0.5px solid var(--color-border-tertiary)}
.event.amber{background:#FAEEDA;border-color:#EF9F27}
.event.teal{background:#E1F5EE;border-color:#5DCAA5}
.event.blue{background:#E6F1FB;border-color:#85B7EB}
.event.fire{background:#FAECE7;border-color:#F0997B}
.event.red{background:#FAEAEA;border-color:#E08080}
.event-time{font-size:13px;font-weight:500;min-width:64px;padding-top:1px}
.event-title{font-size:14px;font-weight:500}
.event-sub{font-size:12px;margin-top:1px;opacity:0.8}
.event.amber .event-time,.event.amber .event-title{color:#633806}
.event.amber .event-sub{color:#854F0B}
.event.teal .event-time,.event.teal .event-title{color:#085041}
.event.teal .event-sub{color:#0F6E56}
.event.blue .event-time,.event.blue .event-title{color:#0C447C}
.event.blue .event-sub{color:#185FA5}
.event.fire .event-time,.event.fire .event-title{color:#712B13}
.event.fire .event-sub{color:#993C1D}
.event.red .event-time,.event.red .event-title{color:#7C1D1D}
.event.red .event-sub{color:#9B3030}
.proof-bar{padding:6px 12px;border-radius:8px;background:var(--color-background-secondary);border:0.5px dashed var(--color-border-secondary);font-size:12px;color:var(--color-text-secondary);display:flex;justify-content:space-between}
.proof-bar .hours{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.flour-select-wrap{position:relative;display:flex;align-items:center;gap:6px}
.flour-select-wrap select{font-size:12px;padding:5px 10px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);max-width:220px}
.pan-size-inputs{display:flex;align-items:center;gap:6px}
.pan-size-inputs input{width:56px;font-size:12px;padding:5px 8px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);text-align:center}
.pan-x{font-size:12px;color:var(--color-text-secondary)}
.pan-unit{font-size:11px;color:var(--color-text-secondary)}
.info-btn{width:18px;height:18px;border-radius:50%;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.info-btn:hover{background:var(--color-background-secondary)}
.popover{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:20;width:300px;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,0.12);padding:0.75rem 0.875rem;font-size:12px;color:var(--color-text-secondary);line-height:1.5}
.popover.open{display:block}
.popover .p-title{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.popover .p-stats{display:flex;gap:10px;margin-bottom:6px;font-size:11px}
.popover .p-stats span b{color:var(--color-text-primary);font-weight:500}
.ferment-row{position:relative}
.manitoba-row{padding:0.75rem 1.5rem;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;position:relative}
.manitoba-row label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-text-secondary);white-space:nowrap}
.manitoba-row .ctrl-row{flex:1;max-width:180px}
@media(prefers-color-scheme:dark){
.fbtn.active{background:#f5f0e8;color:#1a1a1a;border-color:#f5f0e8}
.style-btn.active{background:#e0453f;color:#fff;border-bottom-color:#e0453f}
.tab.active{border-bottom-color:#e0453f}
.badge-amber{background:#412402;color:#FAC775}
.badge-teal{background:#04342C;color:#5DCAA5}
.badge-blue{background:#042C53;color:#85B7EB}
.badge-red{background:#4A0D0D;color:#F4AAAA}
.badge-grey{background:#2A2A2A;color:#CCC}
.diff-tag{background:#4A3600;color:#FFD97D}
}
@media(min-width:1400px){
  .side-panel{display:block}
  .card{width:640px}
  #timeline-tab-btn{display:none}
  #tab-recipe{display:block !important}
}

.wizard-launch-bar{padding:0.9rem 1.5rem;background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary);display:flex;justify-content:center;gap:0.75rem;flex-wrap:wrap}
.wizard-launch-btn{font-size:15px;font-weight:700;padding:12px 26px;border-radius:26px;border:2px solid #B3202A;background:#B3202A;color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(179,32,42,0.35);transition:all .15s}
.wizard-launch-btn:hover{background:#8f1a22;box-shadow:0 6px 18px rgba(179,32,42,0.45);transform:translateY(-1px)}
.saved-recipes-btn{font-size:15px;font-weight:700;padding:12px 26px;border-radius:26px;border:2px solid #1a1a1a;background:transparent;color:#1a1a1a;cursor:pointer;transition:all .15s}
.saved-recipes-btn:hover{background:#1a1a1a;color:#fff}
@media(prefers-color-scheme:dark){
  .saved-recipes-btn{border-color:#f5f0e8;color:#f5f0e8}
  .saved-recipes-btn:hover{background:#f5f0e8;color:#1a1a1a}
}
.wizard-overlay{position:fixed;inset:0;background:rgba(20,10,8,0.72);z-index:999;display:flex;align-items:center;justify-content:center;padding:1rem}
.wizard-card{background:var(--color-background-primary);border-radius:16px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;padding:1.5rem;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.wizard-progress{display:flex;gap:6px;justify-content:center;margin-bottom:1.25rem}
.wizard-dot{width:8px;height:8px;border-radius:50%;background:var(--color-border-secondary)}
.wizard-dot.active{background:#B3202A}
.wizard-dot.done{background:#c9878b}
.wizard-step-title{font-size:16px;font-weight:600;color:var(--color-text-primary);margin-bottom:1rem;text-align:center}
.wizard-options{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;margin-bottom:0.5rem}
.wizard-options.single-col{grid-template-columns:1fr}
.wizard-opt{padding:0.9rem 0.75rem;border-radius:10px;border:1.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:13px;font-weight:500;cursor:pointer;text-align:left;transition:all .15s}
.wizard-opt.active{border-color:#B3202A;background:#FAEAEA;color:#7C1D1D}
.wizard-opt-sub{display:block;font-size:11px;font-weight:400;color:var(--color-text-secondary);margin-top:2px}
.wizard-info-box{margin-top:0.75rem;padding:0.75rem 0.9rem;background:var(--color-background-secondary);border-radius:10px;font-size:12px;color:var(--color-text-secondary);line-height:1.5}
.wizard-info-box b{color:var(--color-text-primary)}
.wizard-slider-wrap{padding:0.5rem 0.25rem}
.wizard-slider-wrap input[type=range]{width:100%}
.wizard-slider-val{font-size:22px;font-weight:600;color:var(--color-text-primary);text-align:center;margin-bottom:0.5rem}
.wizard-field-row{display:flex;gap:0.75rem;margin-bottom:0.75rem}
.wizard-field-row>div{flex:1}
.wizard-field-row label{display:block;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text-secondary);margin-bottom:4px}
.wizard-field-row select,.wizard-field-row input{width:100%;padding:8px;border-radius:8px;border:1px solid var(--color-border-secondary);font-size:14px}
.wizard-nav{display:flex;align-items:center;justify-content:space-between;margin-top:1.25rem;padding-top:1rem;border-top:0.5px solid var(--color-border-tertiary)}
.wizard-nav button{padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:none}
#wizard-back{background:var(--color-background-secondary);color:var(--color-text-secondary)}
#wizard-next{background:#B3202A;color:#fff}
.wizard-skip{font-size:11px;color:var(--color-text-secondary);cursor:pointer;text-decoration:underline}
.wizard-card.wizard-review{max-width:680px}
.wizard-summary-bar{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;padding:0.75rem 1rem;background:var(--color-background-secondary);border-radius:10px;margin-bottom:1rem}
.wizard-summary-bar>div{text-align:center}
.wizard-summary-bar .label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text-secondary)}
.wizard-summary-bar .big{display:block;font-size:15px;font-weight:600;color:var(--color-text-primary)}
.wizard-review-scroll{max-height:42vh;overflow-y:auto;border:0.5px solid var(--color-border-tertiary);border-radius:10px;padding:1rem;margin-bottom:1rem}
.wizard-review-scroll .recipe-grid{margin-bottom:1rem}
.wizard-close-note{padding:0.85rem 1rem;background:#FAEAEA;color:#7C1D1D;border-radius:10px;font-size:13px;line-height:1.5;font-weight:500;text-align:center}
@media(prefers-color-scheme:dark){.wizard-close-note{background:#4A0D0D;color:#F4AAAA}}
@media(max-width:480px){.wizard-options{grid-template-columns:1fr}}

.saved-recipes-card{max-width:520px}
.save-recipe-form{display:flex;gap:0.5rem;margin-bottom:1.25rem}
.save-recipe-form input{flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--color-border-secondary);font-size:14px}
.save-recipe-form button{padding:10px 18px;border-radius:8px;border:none;background:#B3202A;color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.save-recipe-form button:hover{background:#8f1a22}
.saved-recipes-list{display:flex;flex-direction:column;gap:0.6rem;max-height:44vh;overflow-y:auto}
.saved-recipe-row{display:flex;align-items:center;justify-content:space-between;gap:0.75rem;padding:0.75rem 0.9rem;border:0.5px solid var(--color-border-tertiary);border-radius:10px;background:var(--color-background-secondary)}
.saved-recipe-name{font-size:13px;font-weight:600;color:var(--color-text-primary)}
.saved-recipe-sub{font-size:11px;color:var(--color-text-secondary);margin-top:2px}
.saved-recipe-actions{display:flex;gap:6px;flex-shrink:0}
.sr-load-btn,.sr-delete-btn{padding:6px 14px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;border:none}
.sr-load-btn{background:#1a1a1a;color:#f5f0e8}
.sr-delete-btn{background:transparent;color:#7C1D1D;border:1px solid #d9a3a3}
.saved-recipe-empty{font-size:13px;color:var(--color-text-secondary);text-align:center;padding:1.5rem 0.5rem;line-height:1.5}
#saved-recipes-overlay .wizard-nav{justify-content:center}
</style>
</head>
<body>
<div class="bg-scene" id="bg-scene"></div>

<div class="wizard-overlay" id="wizard-overlay" style="display:none">
  <div class="wizard-card" id="wizard-card">
    <div class="wizard-progress" id="wizard-progress"></div>
    <div class="wizard-body" id="wizard-body"></div>
    <div class="wizard-nav">
      <button id="wizard-back" type="button" onclick="wizardBack()">Back</button>
      <span class="wizard-skip" onclick="closeWizard()">Skip to full page</span>
      <button id="wizard-next" type="button" onclick="wizardNext()">Next</button>
    </div>
  </div>
</div>

<div class="wizard-overlay" id="saved-recipes-overlay" style="display:none">
  <div class="wizard-card saved-recipes-card">
    <div class="wizard-step-title">Saved recipes</div>
    <div class="save-recipe-form">
      <input type="text" id="save-recipe-name" placeholder="Name this setup (optional)" maxlength="40">
      <button type="button" onclick="saveCurrentRecipe()">Save current</button>
    </div>
    <div class="saved-recipes-list" id="saved-recipes-list"></div>
    <div class="wizard-nav">
      <button type="button" onclick="closeSavedRecipes()">Close</button>
    </div>
  </div>
</div>

<div class="page">

  <div class="site-logo">
    <svg viewBox="0 0 520 150" class="badge-logo" role="img" aria-label="Easy Pizza Dough">

const OVEN_TYPES = [

  {id:'stone', label:'Pizza stone', preheatMin:55, bakeTemp:'Oven max — 250°C (Gas 9), 270°C on a few models', bakeTime:'7–8 min', sizeIn:'11″', weightDef:240, info:'Stone releases heat more gently than steel, so it takes longer to fully saturate. Expect a drier, chewier crust with less char — closer to New York texture than true Neapolitan. As with steel, most UK ovens cap out at 250°C, so a 60–90 sec grill/broiler finish at the end helps close the gap to a dedicated pizza oven.'},
  {id:'tray',  label:'Baking tray (no stone/steel)', preheatMin:20, bakeTemp:'220–250°C (Gas Mark 7–9, oven max)', bakeTime:'10–12 min', sizeIn:'10″', weightDef:200, info:'Without stored thermal mass under the dough, the base takes much longer to crisp. Keeping the pizza smaller and slightly thicker helps the centre cook through before the edges overcook. Preheating an ordinary tray upside-down for the last 15 minutes helps a little.'}
];

const OVEN_BRANDS = [

  {id:'roccbox', label:'Gozney Roccbox', preheatMin:15, tempRange:'430\u2013450\u00b0C', bakeTime:'~60 sec', info:'Fast-heating and portable, but limited to a 12\u2033 pizza. Its flame-capture design gives strong, even heat for a quick bake.'},

const MANITOBA_INFO = 'Manitoba is a very high-protein Canadian-wheat flour (14\u201315%), almost never used alone. Blending 10\u201330% into a base flour boosts gluten strength, letting the dough handle longer ferments and higher hydration without collapsing \u2014 useful for 48hr+ cold ferments.';

const POOLISH_INFO = 'A poolish is a wet pre-ferment made the day before \u2014 equal parts flour and water plus a tiny amount of yeast, mixed into a thick batter and left to ferment slowly. Because there\u2019s hardly any yeast, it works gradually over many hours rather than rising fast, and that slow fermentation is what builds the deep, slightly tangy flavour real Neapolitan dough is known for. It also makes the final dough easier to stretch thin without tearing. To use it: mix it the evening before, leave it at room temperature for about 2 hours until it\u2019s active, then move it to the fridge to continue fermenting slowly overnight (or for however many hours your chosen ferment time says). The next day, pull it out of the fridge about an hour before you plan to mix your final dough, so it can come back up to room temperature and get bubbly and domed on top \u2014 that\u2019s the sign it\u2019s ready to use.';

const BRINE_INFO = 'The oil-and-water brine is whisked together just before baking, then poured over the dough as you press in the dimples with your fingertips. In the oven, the water flashes to steam and helps crisp the base and edges, while the oil fries the surface as it bakes \u2014 that combination is what gives focaccia its glossy, slightly crisp top instead of a dry crust. It also carries the salt evenly into every dimple rather than sitting on the surface.';

const FOLD_INFO = 'High-hydration dough like this is too wet to knead by hand, so it\u2019s strengthened with stretch-and-folds instead. Wet one hand, reach under one side of the dough in the bowl, stretch it upward, and fold it over the middle \u2014 turn the bowl a quarter turn and repeat on all four sides. That\u2019s one set. Doing 3 sets, spaced out over the first hour of bulk fermentation, builds a gluten network gently, trapping the gas bubbles that give focaccia its open, airy crumb without ever needing to knead it on a bench.';

const FRICO_INFO = 'Detroit-style pizza\u2019s signature is the cheese-to-the-edge crust, nicknamed \u201cfrico\u201d after the crispy Italian cheese crisp. Push the cheese right out to touch the pan walls all the way round, piling it noticeably thicker at the edges than in the middle. As it bakes, the cheese touching the hot metal fries and caramelizes into a lacy, deep-brown, almost burnt-looking crust \u2014 that\u2019s exactly what you want, not a mistake. Use a cheese that holds up to heat without breaking: classic Detroit uses Wisconsin brick cheese, but a block of white Muenster or Monterey Jack cut into cubes and blended with low-moisture mozzarella gets very close and is far easier to find in the UK. Cubes (not pre-shredded) melt with better structure for this.';

const DETROIT_PAN_INFO = 'Detroit pizza is baked in a deep-sided rectangular steel pan \u2014 the height matters as much as the footprint, since the dough needs room to proof upward and the cheese needs a wall to climb and caramelize against. Anything with sides of roughly 5cm (2\u2033) or more works: a proper Detroit pan if you have one, otherwise a rectangular roasting tin, brownie tin or deep metal cake tin of a similar size. Enter your pan\u2019s inside length and width and the dough amount scales to fit the area \u2014 a bigger footprint needs proportionally more dough at the same thickness.';

const DETROIT_HOME_METHOD_INFO = 'In a home oven, run it as hot as it will go (see Oven max above) with a rack positioned low-ish so the pan gets good bottom heat, and preheat properly — a domestic oven needs a genuine 20–30 min to actually reach and stabilize at its top temperature, not just show it on the dial. Bake the pan plain first so the base and sides set and start to crisp against the hot steel, then pull it out, push the cheese right to the edges and add the sauce, and finish baking until the cheese is bubbling and the edges are deeply caramelized. Because a home oven can’t match a dedicated pizza oven’s heat, a short 1–2 min spell under a hot grill/broiler at the very end helps darken and crisp the frico properly.';

const DETROIT_OUTDOOR_METHOD_INFO = 'A Gozney, Ooni or similar outdoor pizza oven runs 400–500°C — far hotter than any thick pan pizza can take at full blast, since the outside would scorch long before the inside cooked through. The trick is to preheat the stone fully as normal, then turn the flame right down or off once it’s up to temperature, so the pan cooks through gently on residual, ambient heat rather than direct flame — much closer to how a home oven behaves, just inside a much hotter box. Check on it rather than trusting a fixed time, since ovens vary: once the base is set and the top is mostly cooked, push the cheese out to the pan edges, add the sauce, then bring the flame back up (or move the pan closer to it) for a short 30–60 second final blast — just enough to caramelize the cheese into a proper frico crust without burning the base.';

const DETROIT_CHEESE_INFO = 'Classic Detroit pizza uses Wisconsin brick cheese, which UK supermarkets simply don’t stock, so the aim is a blend that melts the same way: rich, structured, and able to fry against the hot pan wall without turning greasy. The reliable UK combination is two parts low-moisture block mozzarella (Galbani or Arla block mozzarella — not the fresh ball kind in water, which is too wet) to one part a mild, meltable block cheese for savoury depth and colour: a mild white cheddar (Cathedral City, Pilgrims Choice or Davidstow block cheddar) or Red Leicester both work well and are in every supermarket. If you want to get closer to the American original, Costco stocks Kirkland Signature Monterey Jack in block form, and some larger Tesco or Waitrose “world foods” aisles occasionally carry it too. Whichever you use, cube it by hand rather than buying it pre-shredded — bagged grated cheese is coated in anti-caking starch that stops it fusing properly into the frico, while hand-cut cubes melt together with real structure and hold up against the pan walls.';

const DETROIT_SAUCE_INFO = 'Detroit sauce is a simple, bright tomato sauce striped on top of the cheese after baking (or in the last few minutes) rather than spread underneath the way most pizzas do — that’s what keeps the base from going soggy. Blitz a tin of good whole plum tomatoes — Mutti, Cirio and Napolina are all reliable UK supermarket brands and a fair stand-in for the San Marzano-style tomatoes used in Detroit — with a crushed garlic clove, a good pinch of dried oregano, a small pinch of sugar to round out the acidity, and salt to taste. Simmer it for 10–15 minutes just to thicken slightly; it doesn’t need to cook down for hours like a pasta sauce, and should still taste fresh and a little sharp against the rich, fried cheese edges. Spoon it on in two or three straight stripes rather than spreading it edge to edge, so you get bites of plain cheese crust alongside the sauced middle.';

const FOCACCIA_TRAY_INFO = 'Pick this when your tray or tin doesn’t match one of the preset sizes. Enter its inside length and width in cm and the dough amount scales to fit the area, using the same ratios and roughly the same thickness as the 23×33cm preset — a bigger tray just gets proportionally more dough. Focaccia is forgiving of tray shape (round, square or rectangular all work), so measure the flat inside base rather than the rim.';

// Yeast rates based on 0.15g per 175g poolish flour at 72hr (original recipe)
// = 0.0857% of poolish flour at 72hr, scaled proportionally up for shorter ferments
const YEAST_RATES = {
  18:{rate:0.00600, note:'Standard overnight'},
  24:{rate:0.00400, note:'Full day cold ferment'},
  36:{rate:0.00220, note:'Extended cold ferment'},
  48:{rate:0.00150, note:'Long cold ferment'},
  72:{rate:0.00086, note:'Very long — minimal yeast'}
};
// Note: 0.00086 × 175 = 0.15g ✓

let style = 'neo';
let flour = 'pizzeria';
let fermentHours = 72;
let mixMethod = 'mixer';

const MIX_INFO = {
  neo:{
    mixer:{time:'5 min', label:'mixer', shortLabel:'mixer', note:'stand mixer on low speed until smooth'},
    hand:{time:'12–15 min', label:'by hand', shortLabel:'by hand', note:'by hand until smooth and it passes the windowpane test — this dough is stiff enough to knead comfortably on a floured bench'}
  },
  ny:{
    mixer:{time:'8 min', label:'mixer', shortLabel:'mixer', note:'stand mixer on medium speed until smooth and elastic'},
    hand:{time:'15–18 min', label:'by hand', shortLabel:'by hand', note:'by hand — knead firmly on the counter, or use the slap-and-fold technique to build gluten faster'}
  },
  focaccia:{
    mixer:{time:'6 min', label:'mixer', shortLabel:'mixer', note:'stand mixer on low speed until no dry flour remains — this dough is too wet to knead'},
    hand:{time:'5 min', label:'by hand', shortLabel:'by hand', note:'mixed with a spatula or your hand until no dry flour remains — too wet to knead, so add one extra fold set (4 total instead of 3) to build enough strength'}
  },
  detroit:{
    mixer:{time:'5 min', label:'mixer', shortLabel:'mixer', note:'stand mixer on low speed until no dry flour remains — this dough is too wet to knead'},
    hand:{time:'4 min', label:'by hand', shortLabel:'by hand', note:'mixed with a spatula or your hand until no dry flour remains — too wet to knead, so add one extra fold set (4 total instead of 3) to build enough strength'}
  }
};
MIX_INFO.home = MIX_INFO.neo;
function foldCount(){ return ((style==='focaccia'||style==='detroit') && mixMethod==='hand') ? 4 : 3; }

const MIX_METHOD_INFO = 'Whether you mix in a stand mixer or by hand changes the technique, not the ingredients. A mixer develops gluten faster and more consistently — useful for stiffer Neapolitan and New York doughs. Very wet doughs like focaccia are too sticky to knead by hand at all, so “by hand” there just means mixing with a spatula and relying more on stretch-and-folds to build strength instead.';

function currentMixInfo(){ return MIX_INFO[style][mixMethod]; }

function setMixMethod(m,btn){
  mixMethod=m;
  document.querySelectorAll('#mix-btns .fbtn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');

const SETTINGS_PREFIX='epd_settings_';

function loadStyleSettings(s){
  try{
    const raw=localStorage.getItem(SETTINGS_PREFIX+s);
    return raw?JSON.parse(raw):null;
  }catch(e){ return null; }
}

function captureCurrentRecipeState(){
  return {
    flour, fermentHours, ovenType, ovenBrand, traySizeId, mixMethod, detroitLength, detroitWidth, detroitOvenChoice, focacciaLength, focacciaWidth,
    hydration:document.getElementById('hydration').value,
    balls:document.getElementById('balls').value,
    weight:document.getElementById('weight').value,
    manitoba:document.getElementById('manitoba').value,
    cookDay:document.getElementById('cook-day').value,
    cookTime:document.getElementById('cook-time').value
  };
}

function saveStyleSettings(){
  try{
    localStorage.setItem(SETTINGS_PREFIX+style, JSON.stringify(captureCurrentRecipeState()));
  }catch(e){ /* localStorage unavailable — ignore */ }
}

/* ---------- Named, explicitly-saved recipes ---------- */
const SAVED_RECIPES_KEY='epd_saved_recipes';

function getSavedRecipes(){
  try{ return JSON.parse(localStorage.getItem(SAVED_RECIPES_KEY))||[]; }catch(e){ return []; }
}

function setSavedRecipesList(list){
  try{ localStorage.setItem(SAVED_RECIPES_KEY, JSON.stringify(list)); }catch(e){ /* ignore */ }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openSavedRecipes(){
  const nameInput=document.getElementById('save-recipe-name');
  if(nameInput) nameInput.value='';
  document.getElementById('saved-recipes-overlay').style.display='flex';
  renderSavedRecipesList();
}

function closeSavedRecipes(){
  document.getElementById('saved-recipes-overlay').style.display='none';
}

function saveCurrentRecipe(){
  const nameInput=document.getElementById('save-recipe-name');
  let name=(nameInput.value||'').trim();
  if(!name){
    const dateStr=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    name=`${STYLE_LABELS[style]} — ${dateStr}`;
  }
  const entry={
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    name, style, savedAt:Date.now(),
    state:captureCurrentRecipeState()
  };
  const list=getSavedRecipes();
  list.unshift(entry);
  setSavedRecipesList(list.slice(0,40));
  nameInput.value='';
  renderSavedRecipesList();
}

function renderSavedRecipesList(){
  const box=document.getElementById('saved-recipes-list');
  const list=getSavedRecipes();
  if(!list.length){
    box.innerHTML='<div class="saved-recipe-empty">No saved recipes yet — set everything up the way you like it, then tap "Save current" above. Saved recipes stay on this device/browser.</div>';
    return;
  }
  box.innerHTML=list.map(r=>{
    const d=new Date(r.savedAt);
    const dateStr=d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    return `<div class="saved-recipe-row">
      <div class="saved-recipe-info">
        <div class="saved-recipe-name">${escapeHtml(r.name)}</div>
        <div class="saved-recipe-sub">${escapeHtml(STYLE_LABELS[r.style]||r.style)} · saved ${dateStr}</div>
      </div>
      <div class="saved-recipe-actions">
        <button type="button" class="sr-load-btn" onclick="loadSavedRecipe('${r.id}')">Load</button>
        <button type="button" class="sr-delete-btn" onclick="deleteSavedRecipe('${r.id}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

function loadSavedRecipe(id){
  const list=getSavedRecipes();
  const r=list.find(x=>x.id===id);
  if(!r) return;
  const btn=document.querySelector('.style-btn[data-style="'+r.style+'"]');
  setStyle(r.style, btn, r.state);
  closeSavedRecipes();
}

function deleteSavedRecipe(id){
  setSavedRecipesList(getSavedRecipes().filter(x=>x.id!==id));
  renderSavedRecipesList();
}

function setStyle(s,btn,overrideState){
  style=s; flour=FLOURS[s][0].id;
  document.querySelectorAll('.style-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const usesPoolish = s==='neo'||s==='home';
  const fermentLabel = usesPoolish?'Poolish ferment':((s==='focaccia'||s==='detroit')?'Bulk ferment':'Cold ferment');
  document.getElementById('ferment-label-title').textContent = fermentLabel;
  document.getElementById('poolish-info-btn').style.display = usesPoolish?'flex':'none';
  document.getElementById('manitoba-row').style.display = (usesPoolish||s==='detroit')?'none':'flex';
  document.getElementById('tray-row').style.display = s==='focaccia'?'flex':'none';
  document.getElementById('focaccia-custom-row').style.display = 'none';
  document.getElementById('detroit-pan-row').style.display = s==='detroit'?'flex':'none';
  document.getElementById('detroit-oven-choice-row').style.display = s==='detroit'?'flex':'none';
  document.getElementById('oven-row').style.display = s==='home'?'flex':'none';
  document.getElementById('oven-brand-row').style.display = (s==='neo'||s==='ny'||s==='focaccia'||(s==='detroit'&&detroitOvenChoice==='outdoor'))?'flex':'none';
  document.getElementById('manitoba').value=0;
  mixMethod='mixer';
  if(s==='focaccia'){ traySizeId='rect2333'; focacciaLength=23; focacciaWidth=33; }
  if(s==='detroit'){ detroitLength=25; detroitWidth=20; detroitOvenChoice='home'; }
  if(s==='home'){ ovenType='steel'; }
  if(s==='neo'||s==='ny'||s==='focaccia'){ ovenBrand='gozney'; }

  const sc=STYLE_CONTROLS[s];
  document.getElementById('balls-label').textContent=sc.ballsLabel;
  document.getElementById('weight-label').textContent=sc.weightLabel;
  const ballsEl=document.getElementById('balls');
  ballsEl.min=sc.ballsMin; ballsEl.max=sc.ballsMax; ballsEl.value=sc.ballsDef;
  const weightEl=document.getElementById('weight');
  weightEl.min=sc.weightMin; weightEl.max=sc.weightMax; weightEl.value=s==='home'?currentOven().weightDef:sc.weightDef;
  document.getElementById('balls-group').style.display = (s==='focaccia'||s==='detroit')?'none':'block';
  document.getElementById('weight-group').style.display = (s==='focaccia'||s==='detroit')?'none':'block';
  document.getElementById('controls-grid').style.gridTemplateColumns = (s==='focaccia'||s==='detroit')?'1fr':'1fr 1fr 1fr';

  // Recall this style's last saved setup, if any — or an explicit saved-recipe snapshot when given
  const saved=overrideState||loadStyleSettings(s);
  let fermentToApply=72;
  if(saved){
    if(FLOURS[s].some(f=>f.id===saved.flour)) flour=saved.flour;
    if(saved.ovenType && OVEN_TYPES.some(o=>o.id===saved.ovenType)) ovenType=saved.ovenType;
    if(saved.ovenBrand && OVEN_BRANDS.some(o=>o.id===saved.ovenBrand)) ovenBrand=saved.ovenBrand;
    if(saved.traySizeId && TRAY_SIZES.some(t=>t.id===saved.traySizeId)) traySizeId=saved.traySizeId;
    if(saved.detroitLength) detroitLength=Math.min(45,Math.max(15,saved.detroitLength));
    if(saved.detroitWidth) detroitWidth=Math.min(45,Math.max(15,saved.detroitWidth));
    if(saved.detroitOvenChoice==='outdoor'||saved.detroitOvenChoice==='home') detroitOvenChoice=saved.detroitOvenChoice;
    if(saved.focacciaLength) focacciaLength=Math.min(70,Math.max(10,saved.focacciaLength));
    if(saved.focacciaWidth) focacciaWidth=Math.min(70,Math.max(10,saved.focacciaWidth));
    if(saved.fermentHours && YEAST_RATES[saved.fermentHours]) fermentToApply=saved.fermentHours;
    if(saved.mixMethod && MIX_INFO[s][saved.mixMethod]) mixMethod=saved.mixMethod;
    if(saved.manitoba!=null) document.getElementById('manitoba').value=saved.manitoba;
    if(saved.balls!=null) ballsEl.value=saved.balls;
    if(saved.weight!=null) weightEl.value=saved.weight;
  }
  fermentHours=fermentToApply;
  document.querySelectorAll('#ferment-btns .fbtn').forEach(b=>b.classList.toggle('active', parseInt(b.dataset.hours)===fermentHours));
  document.querySelectorAll('#mix-btns .fbtn').forEach(b=>b.classList.toggle('active', b.dataset.method===mixMethod));
  document.querySelectorAll('#detroit-oven-choice-btns .fbtn').forEach(b=>b.classList.toggle('active', b.dataset.choice===detroitOvenChoice));
  document.getElementById('oven-brand-row').style.display = (s==='neo'||s==='ny'||s==='focaccia'||(s==='detroit'&&detroitOvenChoice==='outdoor'))?'flex':'none';

  if(s==='focaccia'){ renderTraySelect(); renderFocacciaTrayInputs(); }
  if(s==='detroit'){ renderDetroitPanInputs(); }
  if(s==='home'){ renderOvenSelect(); }
  if(s==='neo'||s==='ny'||s==='focaccia'||(s==='detroit'&&detroitOvenChoice==='outdoor')){ renderOvenBrandSelect(); }

  closeAllPopovers();
  renderFlourSelect();
  renderBackground();
  applyFlourConstraints();

  if(saved){
    if(saved.hydration!=null){
      const h=document.getElementById('hydration');
      const hv=parseInt(saved.hydration);
      if(hv>=parseInt(h.min)&&hv<=parseInt(h.max)) h.value=hv;
    }
    if(saved.cookDay!=null) document.getElementById('cook-day').value=saved.cookDay;
    if(saved.cookTime) document.getElementById('cook-time').value=saved.cookTime;
  }
  update();
}

function setFlour(f){
  flour=f;
  applyFlourConstraints();
  closeAllPopovers();
  update();
}

function applyFlourConstraints(){
  const fd=FLOURS[style].find(f2=>f2.id===flour);
  const h=document.getElementById('hydration');
  const manitobaPctVal=parseInt(document.getElementById('manitoba').value)||0;
  const bump=(style==='neo'||style==='home'||style==='detroit')?0:Math.round(manitobaPctVal/30*5);
  h.min=fd.hydMin; h.max=fd.hydMax+bump;
  if(parseInt(h.value)<fd.hydMin||parseInt(h.value)>fd.hydMax+bump) h.value=fd.hydDef;
}

function renderFlourSelect(){
  const sel=document.getElementById('flour-select');
  sel.innerHTML='';
  FLOURS[style].forEach(f=>{
    const o=document.createElement('option');
    o.value=f.id; o.textContent=f.label;
    if(f.id===flour) o.selected=true;
    sel.appendChild(o);
  });
}

function closeAllPopovers(){
  document.querySelectorAll('.popover').forEach(p=>p.classList.remove('open'));
}

function togglePop(evt,id){
  evt.stopPropagation();
  const pop=document.getElementById(id);
  const wasOpen=pop.classList.contains('open');
  closeAllPopovers();
  if(!wasOpen){
    renderPopoverContent(id);
    pop.classList.add('open');
  }
}

function hydrationGuidance(fd){
  return `Handles ${fd.hydMin}\u2013${fd.hydMax}% hydration. If you're new to this flour, start at ${fd.hydMin}% and build up to ${fd.hydDef}% before going higher \u2014 pushing towards ${fd.hydMax}% gives a more open, airy crumb, but wetter dough is stickier and much harder to shape and stretch without tearing. Build up gradually as your technique improves.`;
}

function renderInfoPanel(){
  const fd=FLOURS[style].find(f=>f.id===flour);
  let html=`<div class="info-block"><div class="info-block-title">${fd.label}</div>
    <div class="p-stats"><span>Protein <b>${fd.protein}</b></span><span>Strength <b>${fd.w}</b></span></div>
    <div>${fd.info}</div>
    <div style="margin-top:8px;padding-top:8px;border-top:0.5px solid var(--color-border-tertiary)"><b style="color:var(--color-text-primary)">Hydration:</b> ${hydrationGuidance(fd)}</div>
  </div>`;

  if(style==='home'){
    const o=currentOven();
    html+=`<div class="info-block"><div class="info-block-title">${o.label}</div><div>${o.info}</div></div>`;
  } else if(style==='detroit'){
    html+=`<div class="info-block"><div class="info-block-title">${detroitPanLabel()}</div><div>${DETROIT_PAN_INFO}</div></div>`;
    if(detroitOvenChoice==='outdoor'){
      const ob=currentOvenBrand();
      html+=`<div class="info-block"><div class="info-block-title">${ob.label} — flame off to cook through</div><div>${DETROIT_OUTDOOR_METHOD_INFO}</div></div>`;
    } else {
      html+=`<div class="info-block"><div class="info-block-title">Home oven method</div><div>${DETROIT_HOME_METHOD_INFO}</div></div>`;
    }
  } else {
    const ob=currentOvenBrand();

function fmt(v){
  if(v<1)  return v.toFixed(2)+'g';
  if(v<10) return v.toFixed(1)+'g';
  return Math.round(v)+'g';
}

function pizzaSize(g){
  if(g<=220) return '10″';
  if(g<=250) return '11″';
  if(g<=290) return '12″';
  if(g<=310) return '13″';
  return '14″';
}

function manitobaPct(){
  if(style==='neo'||style==='home'||style==='detroit') return 0;
  return parseInt(document.getElementById('manitoba').value)||0;
}

function calcDough(){
  const balls    =parseInt(document.getElementById('balls').value);
  const weight   =parseInt(document.getElementById('weight').value);
  const hydration=parseInt(document.getElementById('hydration').value)/100;
  const totalDough=style==='focaccia'?(traySizeId==='custom'?focacciaDoughWeight():(TRAY_SIZES.find(t=>t.id===traySizeId)?.doughRec||900)):(style==='detroit'?detroitDoughWeight():balls*weight);

  if(style==='neo'||style==='home'){
    const totalFlour  =totalDough/(1+hydration+0.024);
    const totalWater  =totalFlour*hydration;
    const salt        =totalFlour*0.024;
    const poolishFlour=totalFlour*0.5;
    const poolishWater=poolishFlour;
    const finalFlour  =totalFlour-poolishFlour;
    const finalWater  =totalWater-poolishWater;
    const yeast       =poolishFlour*YEAST_RATES[fermentHours].rate;
    return{totalDough,totalFlour,totalWater,salt,poolishFlour,poolishWater,finalFlour,finalWater,yeast};
  } else if(style==='ny'){
    const totalFlour=totalDough/(1+hydration+0.02+0.02+0.01);
    const totalWater=totalFlour*hydration;
    const salt =totalFlour*0.02;
    const oil  =totalFlour*0.02;
    const sugar=totalFlour*0.01;
    const yeast=totalFlour*YEAST_RATES[fermentHours].rate;
    return{totalDough,totalFlour,totalWater,salt,oil,sugar,yeast};
  } else if(style==='detroit'){
    const totalFlour=totalDough/(1+hydration+0.02);
    const totalWater=totalFlour*hydration;
    const salt =totalFlour*0.02;
    const yeast=totalFlour*YEAST_RATES[fermentHours].rate;
    const area =detroitArea();
    const panButter=area*0.0155;
    const panOil   =area*0.0144;
    const cheese   =area*0.9;
    const sauce    =area*0.34;
    return{totalDough,totalFlour,totalWater,salt,yeast,panButter,panOil,area,cheese,sauce};
  } else {
    const totalFlour=totalDough/(1+hydration+0.025+0.05);
    const totalWater=totalFlour*hydration;
    const salt=totalFlour*0.025;
    const oil =totalFlour*0.05;
    const yeast=totalFlour*YEAST_RATES[fermentHours].rate;
    return{totalDough,totalFlour,totalWater,salt,oil,yeast};
  }
}

function flourRows(amount,flourName){
  const pct=manitobaPct();
  if(pct>0){
    const base=amount*(1-pct/100);
    const man=amount*(pct/100);
    return `<div class="row"><span class="name">${flourName} (${100-pct}%)</span><span class="amount">${fmt(base)}</span></div>
            <div class="row"><span class="name">Manitoba blend (${pct}%) <span class="diff-tag">boost</span></span><span class="amount">${fmt(man)}</span></div>`;
  }
  return `<div class="row"><span class="name">${flourName}</span><span class="amount">${fmt(amount)}</span></div>`;
}

          <div class="step"><div class="n">Pre-bake</div><div class="v">${detroitOvenChoice==='outdoor'?'4–5 min, no toppings, on residual heat':'5–6 min, no toppings'}</div></div>
          <div class="step"><div class="n">Cheese to edges + bake</div><div class="v">${detroitOvenChoice==='outdoor'?'8–10 min on low heat, then flame up 30–60 sec':'10–12 min, then grill 1–2 min'}</div></div>
        </div>
        <div style="text-align:right;margin-top:6px">
          <button class="info-btn" type="button" onclick="togglePop(event,'frico-popover')" style="display:inline-flex;vertical-align:middle">i</button>
          <span style="font-size:11px;color:var(--color-text-secondary)">What's the frico?</span>
          <div class="popover" id="frico-popover" style="left:auto;right:0"></div>
        </div>
      </div>
      <div class="note">Sized for a ${sz} pan (we assume sides at least 5cm/2″ deep — a shallower tray won't hold this much dough as it proofs). Push the dough out to the pan edges rather than stretching it thin, then pile cheese right to the walls so it caramelizes into the "frico" crust. Sauce goes on top of the cheese in two or three stripes, added either before the final few minutes or straight after baking — not underneath — which is what keeps the base crisp. ${detroitOvenChoice==='outdoor'?`Your ${ob.label} runs ${ob.tempRange} — far too hot for a thick pan pizza at full blast — so once the stone's up to temperature turn the flame right down or off and let the pan cook through gently on residual heat, checking rather than trusting the clock. Once the base is set, push the cheese to the edges, then bring the flame back up for a final 30–60 sec to caramelize it into the frico.`:'Most UK domestic ovens top out around 250°C (Gas Mark 9, a little higher — 270°C — on some), well short of the 430°C+ a Gozney or Ooni runs at, so once the main bake is done finish the pizza for 1–2 min under a hot grill/broiler to properly darken and crisp the cheese edges the way a dedicated pizza oven would in seconds.'} Salt at 2% of flour; no oil in the dough itself, it's all in the pan instead. Mixing ${mi.note}.</div>`;
  }
}

function addDays(date,days){const d=new Date(date);d.setDate(d.getDate()+days);return d;}
function dayName(d){return DAYS[d.getDay()];}
function fmt12(h,m){const ap=h>=12?'pm':'am';const hh=h%12||12;return`${hh}:${String(m).padStart(2,'0')}${ap}`;}
function subtractMinutes(h,m,mins){let total=h*60+m-mins;total=((total%1440)+1440)%1440;return{h:Math.floor(total/60),m:total%60};}

  document.getElementById('bake-info').textContent  =style==='neo'?currentOvenBrand().bakeTime:(style==='ny'?'2–3 min':(style==='home'?currentOven().bakeTime:(style==='detroit'?(detroitOvenChoice==='outdoor'?'13–16 min total':'17–20 min total'):'8–12 min')));
  if(document.getElementById('flour-popover').classList.contains('open')) renderPopoverContent('flour-popover');
  renderInfoPanel();
  renderRecipe(d);
  renderTimeline();
  saveStyleSettings();
}

/* ---------- Guided wizard ---------- */
let wizardSteps=[];
let wizardIndex=0;

const STYLE_LABELS={neo:'Neapolitan',ny:'New York',focaccia:'Focaccia',detroit:'Detroit',home:'Home Oven'};
const STYLE_SUB={neo:'Classic wood-fired style, poolish pre-ferment',ny:'Big, foldable slice, straight dough',focaccia:'Thick, olive-oil rich, baked in a tray',detroit:'Deep pan, crispy cheese-to-the-edge crust',home:'No pizza oven? Steel, stone or a tray all work'};

function computeWizardSteps(){
  const steps=['style','flour','mix'];
  if(style==='home'){ steps.push('oven'); }
  else if(style==='detroit'){ steps.push('pan','detroitOven'); if(detroitOvenChoice==='outdoor') steps.push('ovenBrand'); }
  else { steps.push('ovenBrand'); if(style==='focaccia') steps.push('tray'); }
  if(style==='ny'||style==='focaccia') steps.push('blend');
  steps.push('hydration','ferment');
  if(style!=='focaccia'&&style!=='detroit') steps.push('amount');
  steps.push('cook','review');
  return steps;
}

function openWizard(){
  wizardIndex=0;
  wizardSteps=computeWizardSteps();
  document.getElementById('wizard-overlay').style.display='flex';
  renderWizardStep();
}

function closeWizard(){
  document.getElementById('wizard-overlay').style.display='none';
}

function finishWizard(){
  closeWizard();
}

function wizardNext(){
  if(wizardIndex<wizardSteps.length-1){
    wizardIndex++;
    renderWizardStep();
  } else {
    finishWizard();
  }
}

function wizardBack(){
  if(wizardIndex>0){
    wizardIndex--;
    renderWizardStep();
  }
}

function wizardChooseStyle(s){
  const btn=document.querySelector('.style-btn[data-style="'+s+'"]');
  setStyle(s,btn);
  wizardSteps=computeWizardSteps();
  renderWizardStep();
}

function wizardSetFlour(f){

}

function wizardSetMixMethod(m){

}

function wizardSetOvenType(id){
  setOvenType(id);

}

function wizardSetOvenBrand(id){

  const name=wizardSteps[wizardIndex];

  if(name==='style'){

    const list=FLOURS[style];
    const fd=list.find(f=>f.id===flour)||list[0];
    html=`<div class="wizard-step-title">Which flour are you using?</div><div class="wizard-options single-col">`+
      list.map(f=>optCard(f.id===flour,`wizardSetFlour('${f.id}')`,f.label,`Protein ${f.protein}`)).join('')+
      `</div><div class="wizard-info-box">${fd.info}<br><br><b>Hydration:</b> ${hydrationGuidance(fd)}</div>`;
  } else if(name==='mix'){
    const mopts=[{id:'mixer',label:'Stand mixer'},{id:'hand',label:'By hand'}];
    html=`<div class="wizard-step-title">How will you mix the dough?</div><div class="wizard-options single-col">`+
      mopts.map(m=>optCard(mixMethod===m.id,`wizardSetMixMethod('${m.id}')`,m.label,MIX_INFO[style][m.id].time)).join('')+
      `</div><div class="wizard-info-box">${MIX_INFO[style][mixMethod].note}</div>`;
  } else if(name==='oven'){
    html=`<div class="wizard-step-title">What are you baking on?</div><div class="wizard-options single-col">`+
      OVEN_TYPES.map(o=>optCard(o.id===ovenType,`wizardSetOvenType('${o.id}')`,o.label,`Preheat ${o.preheatMin} min · ${o.bakeTemp}`)).join('')+
      `</div><div class="wizard-info-box">${currentOven().info}</div>`;
  } else if(name==='ovenBrand'){
    html=`<div class="wizard-step-title">Which oven are you cooking on?</div><div class="wizard-options single-col">`+
      OVEN_BRANDS.map(o=>optCard(o.id===ovenBrand,`wizardSetOvenBrand('${o.id}')`,o.label,`${o.tempRange} · ${o.bakeTime}`)).join('')+
      `</div><div class="wizard-info-box">${currentOvenBrand().info}</div>`;
  } else if(name==='tray'){
    html=`<div class="wizard-step-title">What tray are you using?</div><div class="wizard-options single-col">`+
      TRAY_SIZES.map(t=>optCard(t.id===traySizeId,`wizardSetTray('${t.id}')`,t.label,t.doughRec?`~${t.doughRec}g dough`:'Enter your own size')).join('')+
      `</div>`;
    if(traySizeId==='custom'){
      html+=`<div class="wizard-field-row">
        <div><label>Length (cm)</label><input type="number" id="wizard-focaccia-length" min="10" max="70" step="0.5" value="${focacciaLength}" onchange="wizardFocacciaTrayInput()"></div>
        <div><label>Width (cm)</label><input type="number" id="wizard-focaccia-width" min="10" max="70" step="0.5" value="${focacciaWidth}" onchange="wizardFocacciaTrayInput()"></div>
      </div>
      <div class="wizard-slider-val">~<span id="wizard-tray-dough-val">${fmt(focacciaDoughWeight())}</span> dough</div>
      <div class="wizard-info-box">${FOCACCIA_TRAY_INFO}</div>`;
    }
  } else if(name==='detroitOven'){
    const dopts=[{id:'home',label:'Home oven'},{id:'outdoor',label:'Pizza oven (Gozney, Ooni, etc)'}];
    html=`<div class="wizard-step-title">Cooking in a home oven or a pizza oven?</div><div class="wizard-options single-col">`+
      dopts.map(o=>optCard(detroitOvenChoice===o.id,`wizardSetDetroitOvenChoice('${o.id}')`,o.label,o.id==='outdoor'?'Preheat, then flame off to cook through':'Bake plain, then cheese to the edges')).join('')+
      `</div><div class="wizard-info-box">${detroitOvenChoice==='outdoor'?DETROIT_OUTDOOR_METHOD_INFO:DETROIT_HOME_METHOD_INFO}</div>`;
  } else if(name==='pan'){
    html=`<div class="wizard-step-title">What size is your pan?</div>
      <div class="wizard-field-row">
        <div><label>Length (cm)</label><input type="number" id="wizard-detroit-length" min="15" max="45" step="0.5" value="${detroitLength}" onchange="wizardDetroitPanInput()"></div>
        <div><label>Width (cm)</label><input type="number" id="wizard-detroit-width" min="15" max="45" step="0.5" value="${detroitWidth}" onchange="wizardDetroitPanInput()"></div>
      </div>
      <div class="wizard-slider-val">~<span id="wizard-pan-dough-val">${fmt(detroitDoughWeight())}</span> dough</div>
      <div class="wizard-info-box">${DETROIT_PAN_INFO}</div>`;
  } else if(name==='blend'){
    const v=document.getElementById('manitoba').value;
    html=`<div class="wizard-step-title">Manitoba blend?</div>
      <div class="wizard-slider-val" id="wizard-blend-val">${v}%</div>
      <div class="wizard-slider-wrap"><input type="range" min="0" max="30" step="5" value="${v}" oninput="wizardManitobaInput(this.value)"></div>
      <div class="wizard-info-box">${MANITOBA_INFO}</div>`;
  } else if(name==='hydration'){
    const h=document.getElementById('hydration');
    const fd=FLOURS[style].find(f=>f.id===flour);
    html=`<div class="wizard-step-title">Choose your hydration</div>
      <div class="wizard-slider-val" id="wizard-hyd-val">${h.value}%</div>
      <div class="wizard-slider-wrap"><input type="range" min="${h.min}" max="${h.max}" step="1" value="${h.value}" oninput="wizardHydrationInput(this.value)"></div>
      <div class="wizard-info-box">${hydrationGuidance(fd)}</div>`;
  } else if(name==='ferment'){
    html=`<div class="wizard-step-title">How long will you ferment?</div><div class="wizard-options single-col">`+
      [18,24,36,48,72].map(h=>optCard(h===fermentHours,`wizardSetFerment(${h})`,h+' hours',YEAST_RATES[h].note)).join('')+
      `</div>`;
  } else if(name==='amount'){
    const sc=STYLE_CONTROLS[style];
    const ballsEl=document.getElementById('balls'), weightEl=document.getElementById('weight');
    html=`<div class="wizard-step-title">How much dough?</div>
      <label style="font-size:12px;color:var(--color-text-secondary)">${sc.ballsLabel}: <b id="wizard-balls-val">${ballsEl.value}</b></label>
      <div class="wizard-slider-wrap"><input type="range" min="${sc.ballsMin}" max="${sc.ballsMax}" step="1" value="${ballsEl.value}" oninput="wizardBallsInput(this.value)"></div>
      <label style="font-size:12px;color:var(--color-text-secondary)">${sc.weightLabel}: <b id="wizard-weight-val">${weightEl.value}g</b></label>
      <div class="wizard-slider-wrap"><input type="range" min="${sc.weightMin}" max="${sc.weightMax}" step="5" value="${weightEl.value}" oninput="wizardWeightInput(this.value)"></div>`;
  } else if(name==='cook'){
    const cd=document.getElementById('cook-day').value, ct=document.getElementById('cook-time').value;
    html=`<div class="wizard-step-title">When are you cooking?</div>
      <div class="wizard-field-row">
        <div><label>Cook day</label><select id="wizard-cook-day" onchange="wizardCookChange()">
          ${DAYS.map((d,i)=>`<option value="${i}"${String(i)===cd?' selected':''}>${d}</option>`).join('')}
        </select></div>
        <div><label>Cook time</label><input type="time" id="wizard-cook-time" value="${ct}" onchange="wizardCookChange()"></div>
      </div>
      <div class="wizard-info-box">We'll work backwards from this to schedule everything — mixing, folding, fridge time and preheating.</div>`;
  } else if(name==='review'){
    const totalDough=document.getElementById('total-dough').textContent;
    const totalFlour=document.getElementById('total-flour').textContent;
    const totalWater=document.getElementById('total-water').textContent;
    const sizeLabel=document.getElementById('size-label').textContent;
    const pizzaSize=document.getElementById('pizza-size').textContent;
    const bakeInfo=document.getElementById('bake-info').textContent;
    html=`<div class="wizard-step-title">Your bake plan is ready</div>
      <div class="wizard-summary-bar">
        <div><span class="label">Total dough</span><span class="big">${totalDough}</span></div>
        <div><span class="label">Total flour</span><span class="big">${totalFlour}</span></div>
        <div><span class="label">Total water</span><span class="big">${totalWater}</span></div>
        <div><span class="label">${sizeLabel}</span><span class="big">${pizzaSize}</span></div>
        <div><span class="label">Bake</span><span class="big">${bakeInfo}</span></div>
      </div>
      <div class="wizard-review-scroll">
        <div class="recipe-grid">${document.getElementById('recipe-grid').innerHTML}</div>
        <div class="tl-controls" style="display:none"></div>
        ${document.getElementById('timeline-content').innerHTML}
      </div>
      <div class="wizard-close-note">When you close this window, this exact recipe and timeline will be waiting for you on the main page — nothing to redo.</div>`;
  }

  document.getElementById('wizard-card').classList.toggle('wizard-review', name==='review');
  body.innerHTML=html;

  document.getElementById('wizard-progress').innerHTML=wizardSteps.map((s,i)=>
    `<span class="wizard-dot${i===wizardIndex?' active':(i<wizardIndex?' done':'')}"></span>`).join('');
  document.getElementById('wizard-back').style.visibility=wizardIndex===0?'hidden':'visible';
  const isLast=wizardIndex===wizardSteps.length-1;
  document.getElementById('wizard-next').textContent=isLast?'Close':'Next';
  const skipEl=document.querySelector('.wizard-skip');
  if(skipEl) skipEl.style.display=isLast?'none':'inline';
}

renderTraySelect();
renderOvenSelect();
renderOvenBrandSelect();
layoutForWidth(wideQuery);
// Route the very first render through setStyle so this style's saved
// setup (flour, hydration, ferment, oven, mix method, cook time...) is
// restored on load too, not only when the person switches tabs.
setStyle(style, document.querySelector('.style-btn[data-style="'+style+'"]'));
</script>
</body>
</html>
