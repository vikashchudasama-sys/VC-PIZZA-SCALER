
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
<style>
:root{
  --color-background-primary:#ffffff;
  --color-background-secondary:#f4f1ea;
  --color-text-primary:#1a1a1a;
  --color-text-secondary:#6b6b5f;
  --color-border-primary:#d8d5cb;
  --color-border-secondary:#c9c6ba;
  --color-border-tertiary:#e3e0d6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f1ea;padding:1.5rem;display:flex;justify-content:center;position:relative}
.bg-scene{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#f4f1ea;transition:opacity .3s}
.bg-scene::after{content:'';position:absolute;inset:0;background:rgba(244,241,234,0.4)}
.bg-scene img{width:100%;height:100%;object-fit:cover;display:block}
.page{display:flex;flex-direction:column;align-items:center;gap:1rem;width:100%}
.site-logo{display:flex;flex-direction:column;align-items:center;gap:0.5rem;max-width:640px;width:100%}
.site-logo .badge-logo{width:100%;max-width:420px;height:auto}
.site-tagline{color:var(--color-text-secondary);font-size:13px;text-align:center}
.app-shell{display:flex;gap:1.5rem;align-items:flex-start;justify-content:center;width:100%}
.side-panel{width:240px;flex-shrink:0;display:none}
.side-timeline-panel{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:1rem 1.25rem;max-height:calc(100vh - 3rem);overflow-y:auto;width:320px}
.side-timeline-header{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-text-secondary);margin-bottom:0.75rem;padding-bottom:0.5rem;border-bottom:0.5px solid var(--color-border-tertiary)}
#side-timeline-slot #tab-timeline{padding:0;display:block}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg,12px);overflow:hidden;max-width:640px;width:100%}
.style-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0}
.style-btn{padding:0.75rem 1rem;border:none;background:var(--color-background-secondary);color:var(--color-text-secondary);font-size:13px;font-weight:500;cursor:pointer;border-bottom:0.5px solid var(--color-border-tertiary);border-right:0.5px solid var(--color-border-tertiary);transition:all .15s}
.style-btn:last-child{border-right:none}
.style-btn.active{background:#1a1a1a;color:#f5f0e8}
.flour-row{padding:0.75rem 1.5rem;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap}
.flour-row label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-text-secondary);white-space:nowrap}
.flour-btns{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{font-size:12px;padding:4px 12px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;transition:all .15s}
.fbtn.active{background:#1a1a1a;color:#f5f0e8;border-color:#1a1a1a}
.controls{padding:1rem 1.5rem;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
.ctrl-group label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-text-secondary);display:block;margin-bottom:5px}
.ctrl-row{display:flex;align-items:center;gap:8px}
.ctrl-row input[type=range]{flex:1;min-width:0;accent-color:#1a1a1a}
.ctrl-val{font-size:15px;font-weight:500;color:var(--color-text-primary);min-width:2ch;text-align:right}
.ctrl-unit{font-size:11px;color:var(--color-text-secondary)}
.ferment-row{padding:0.75rem 1.5rem;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap}
.ferment-row label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-text-secondary);white-space:nowrap}
.yeast-note{margin-left:auto;font-size:11px;color:var(--color-text-secondary);font-style:italic}
.total-bar{padding:0.75rem 1.5rem;background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary);display:flex;gap:1.25rem;align-items:baseline;flex-wrap:wrap}
.total-bar .label{font-size:11px;color:var(--color-text-secondary)}
.total-bar .big{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.total-bar .sep{color:var(--color-border-secondary);font-size:14px;align-self:center}
.tabs{display:flex;border-bottom:0.5px solid var(--color-border-tertiary)}
.tab{flex:1;padding:0.6rem;font-size:12px;font-weight:500;text-align:center;cursor:pointer;background:var(--color-background-secondary);color:var(--color-text-secondary);border:none;border-right:0.5px solid var(--color-border-tertiary);transition:all .15s}
.tab:last-child{border-right:none}
.tab.active{background:var(--color-background-primary);color:var(--color-text-primary)}
.tab-content{display:none;padding:1.25rem 1.5rem}
.tab-content.active{display:block}
.recipe-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.stage{border:0.5px solid var(--color-border-tertiary);border-radius:8px;padding:0.875rem 1rem;position:relative}
.stage.full{grid-column:1/-1}
.badge{font-size:10px;font-weight:500;padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:0.75rem}
.badge-amber{background:#FAEEDA;color:#633806}
.badge-teal{background:#E1F5EE;color:#085041}
.badge-blue{background:#E6F1FB;color:#0C447C}
.badge-red{background:#FAEAEA;color:#7C1D1D}
.badge-grey{background:#F0F0F0;color:#444}
.section-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-text-secondary);margin-bottom:0.5rem}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.row:last-child{border-bottom:none}
.row .name{font-size:13px;color:var(--color-text-secondary)}
.row .amount{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.timing{display:flex;gap:6px;margin-top:0.75rem;padding-top:0.75rem;border-top:0.5px solid var(--color-border-tertiary)}
.timing-item{flex:1;text-align:center;background:var(--color-background-secondary);border-radius:6px;padding:5px 4px}
.timing-item .t-val{font-size:12px;font-weight:500;color:var(--color-text-primary);display:block}
.timing-item .t-label{font-size:10px;color:var(--color-text-secondary)}
.steps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:0.5rem}
.step{background:var(--color-background-secondary);border-radius:6px;padding:7px 6px;text-align:center}
.step .n{font-size:10px;color:var(--color-text-secondary);margin-bottom:2px}
.step .v{font-size:12px;font-weight:500;color:var(--color-text-primary)}
.note{grid-column:1/-1;font-size:11px;color:var(--color-text-secondary);padding-top:0.75rem;border-top:0.5px solid var(--color-border-tertiary);line-height:1.6}
.diff-tag{font-size:10px;background:#FFF3CD;color:#7A4F00;padding:1px 5px;border-radius:3px;margin-left:4px}
.tl-controls{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.tl-ctrl label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-text-secondary);display:block;margin-bottom:5px}
.tl-ctrl select,.tl-ctrl input{width:100%;padding:6px 10px;border:0.5px solid var(--color-border-secondary);border-radius:6px;font-size:13px;background:var(--color-background-primary);color:var(--color-text-primary)}
.day-block{margin-bottom:1.25rem}
.day-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-secondary);margin-bottom:0.5rem;padding-bottom:0.25rem;border-bottom:0.5px solid var(--color-border-tertiary)}
.events{display:flex;flex-direction:column;gap:6px}
.event{display:flex;align-items:flex-start;gap:12px;padding:8px 12px;border-radius:8px;border:0.5px solid var(--color-border-tertiary)}
.event.amber{background:#FAEEDA;border-color:#EF9F27}
.event.teal{background:#E1F5EE;border-color:#5DCAA5}
.event.blue{background:#E6F1FB;border-color:#85B7EB}
.event.fire{background:#FAECE7;border-color:#F0997B}
.event.red{background:#FAEAEA;border-color:#E08080}
.event-time{font-size:13px;font-weight:500;min-width:64px;padding-top:1px}
.event-title{font-size:14px;font-weight:500}
.event-sub{font-size:12px;margin-top:1px;opacity:0.8}
.event.amber .event-time,.event.amber .event-title{color:#633806}
.event.amber .event-sub{color:#854F0B}
.event.teal .event-time,.event.teal .event-title{color:#085041}
.event.teal .event-sub{color:#0F6E56}
.event.blue .event-time,.event.blue .event-title{color:#0C447C}
.event.blue .event-sub{color:#185FA5}
.event.fire .event-time,.event.fire .event-title{color:#712B13}
.event.fire .event-sub{color:#993C1D}
.event.red .event-time,.event.red .event-title{color:#7C1D1D}
.event.red .event-sub{color:#9B3030}
.proof-bar{padding:6px 12px;border-radius:8px;background:var(--color-background-secondary);border:0.5px dashed var(--color-border-secondary);font-size:12px;color:var(--color-text-secondary);display:flex;justify-content:space-between}
.proof-bar .hours{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.flour-select-wrap{position:relative;display:flex;align-items:center;gap:6px}
.flour-select-wrap select{font-size:12px;padding:5px 10px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);max-width:220px}
.info-btn{width:18px;height:18px;border-radius:50%;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.info-btn:hover{background:var(--color-background-secondary)}
.popover{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:20;width:260px;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,0.12);padding:0.75rem 0.875rem;font-size:12px;color:var(--color-text-secondary);line-height:1.5}
.popover.open{display:block}
.popover .p-title{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.popover .p-stats{display:flex;gap:10px;margin-bottom:6px;font-size:11px}
.popover .p-stats span b{color:var(--color-text-primary);font-weight:500}
.ferment-row{position:relative}
.manitoba-row{padding:0.75rem 1.5rem;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;position:relative}
.manitoba-row label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-text-secondary);white-space:nowrap}
.manitoba-row .ctrl-row{flex:1;max-width:180px}
@media(prefers-color-scheme:dark){
.style-btn.active,.fbtn.active{background:#f5f0e8;color:#1a1a1a;border-color:#f5f0e8}
.badge-amber{background:#412402;color:#FAC775}
.badge-teal{background:#04342C;color:#5DCAA5}
.badge-blue{background:#042C53;color:#85B7EB}
.badge-red{background:#4A0D0D;color:#F4AAAA}
.badge-grey{background:#2A2A2A;color:#CCC}
.diff-tag{background:#4A3600;color:#FFD97D}
}
@media(min-width:1050px){
  .side-panel{display:block}
  .card{width:640px}
  #timeline-tab-btn{display:none}
  #tab-recipe{display:block !important}
}
</style>
</head>
<body>
<div class="bg-scene" id="bg-scene"></div>
<div class="page">

  <div class="site-logo">
    <svg viewBox="0 0 520 150" class="badge-logo" role="img" aria-label="Easy Pizza Dough">
      <rect x="10" y="10" width="500" height="130" rx="65" fill="#F3E9D2" stroke="#B3202A" stroke-width="5"/>
      <text x="260" y="72" font-family="'Titan One', cursive" font-size="28" fill="#B3202A" text-anchor="middle" letter-spacing="2">EASY</text>
      <text x="260" y="110" font-family="'Titan One', cursive" font-size="32" fill="#B3202A" text-anchor="middle" letter-spacing="1">PIZZA DOUGH</text>
    </svg>
    <p class="site-tagline">Neapolitan · New York · Focaccia · live quantities · timeline</p>
  </div>

<div class="app-shell">
  <div class="card">

  <div class="style-row">
    <button class="style-btn active" onclick="setStyle('neo',this)">Neapolitan</button>
    <button class="style-btn" onclick="setStyle('ny',this)">New York</button>
    <button class="style-btn" onclick="setStyle('focaccia',this)">Focaccia</button>
  </div>

  <div class="flour-row">
    <label>Flour</label>
    <div class="flour-select-wrap">
      <select id="flour-select" onchange="setFlour(this.value)"></select>
      <button class="info-btn" type="button" onclick="togglePop(event,'flour-popover')">i</button>
      <div class="popover" id="flour-popover"></div>
    </div>
  </div>

  <div class="flour-row" id="tray-row" style="display:none">
    <label>Tray size</label>
    <div class="flour-select-wrap">
      <select id="tray-select" onchange="setTraySize(this.value)"></select>
    </div>
  </div>

  <div class="manitoba-row" id="manitoba-row" style="display:none">
    <label>Manitoba blend</label>
    <div class="ctrl-row">
      <input type="range" id="manitoba" min="0" max="30" step="5" value="0" oninput="applyFlourConstraints();update()">
      <span class="ctrl-val" id="manitoba-val">0</span><span class="ctrl-unit">%</span>
    </div>
    <button class="info-btn" type="button" onclick="togglePop(event,'manitoba-popover')">i</button>
    <div class="popover" id="manitoba-popover"></div>
  </div>

  <div class="controls" id="controls-grid">
    <div class="ctrl-group" id="balls-group">
      <label id="balls-label">Dough balls</label>
      <div class="ctrl-row">
        <input type="range" id="balls" min="1" max="30" step="1" value="3" oninput="update()">
        <span class="ctrl-val" id="balls-val">3</span>
      </div>
    </div>
    <div class="ctrl-group" id="weight-group">
      <label id="weight-label">Ball weight</label>
      <div class="ctrl-row">
        <input type="range" id="weight" min="200" max="320" step="5" value="270" oninput="update()">
        <span class="ctrl-val" id="weight-val">270</span><span class="ctrl-unit">g</span>
      </div>
    </div>
    <div class="ctrl-group">
      <label>Hydration</label>
      <div class="ctrl-row">
        <input type="range" id="hydration" min="55" max="75" step="1" value="63" oninput="update()">
        <span class="ctrl-val" id="hydration-val">63</span><span class="ctrl-unit">%</span>
      </div>
    </div>
  </div>

  <div class="ferment-row">
    <label id="ferment-label-title">Poolish ferment</label>
    <button class="info-btn" type="button" id="poolish-info-btn" onclick="togglePop(event,'poolish-popover')">i</button>
    <div class="popover" id="poolish-popover"></div>
    <div class="flour-btns" id="ferment-btns">
      <button class="fbtn" onclick="setFerment(18,this)">18 hr</button>
      <button class="fbtn" onclick="setFerment(24,this)">24 hr</button>
      <button class="fbtn" onclick="setFerment(36,this)">36 hr</button>
      <button class="fbtn" onclick="setFerment(48,this)">48 hr</button>
      <button class="fbtn active" onclick="setFerment(72,this)">72 hr</button>
    </div>
    <span class="yeast-note" id="yeast-note"></span>
  </div>

  <div class="total-bar">
    <div><div class="label">Total dough</div><div class="big" id="total-dough">—</div></div>
    <div class="sep">·</div>
    <div><div class="label">Total flour</div><div class="big" id="total-flour">—</div></div>
    <div class="sep">·</div>
    <div><div class="label">Total water</div><div class="big" id="total-water">—</div></div>
    <div class="sep">·</div>
    <div><div class="label" id="size-label">Pizza size</div><div class="big" id="pizza-size">—</div></div>
    <div class="sep">·</div>
    <div><div class="label">Bake</div><div class="big" id="bake-info">—</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" id="recipe-tab-btn" onclick="setTab('recipe',this)">Recipe</button>
    <button class="tab" id="timeline-tab-btn" onclick="setTab('timeline',this)">Timeline</button>
  </div>

  <div class="tab-content active" id="tab-recipe">
    <div class="recipe-grid" id="recipe-grid"></div>
  </div>

  <div id="tab-timeline-slot">
  <div class="tab-content" id="tab-timeline">
    <div class="tl-controls">
      <div class="tl-ctrl">
        <label>Cook day</label>
        <select id="cook-day" onchange="update()">
          <option value="0">Sunday</option>
          <option value="1">Monday</option>
          <option value="2">Tuesday</option>
          <option value="3">Wednesday</option>
          <option value="4">Thursday</option>
          <option value="5">Friday</option>
          <option value="6" selected>Saturday</option>
        </select>
      </div>
      <div class="tl-ctrl">
        <label>Cook time</label>
        <input type="time" id="cook-time" value="18:00" onchange="update()">
      </div>
    </div>
    <div id="timeline-content"></div>
  </div>
  </div>
  </div>

  <div class="side-panel side-timeline-panel">
    <div class="side-timeline-header">Timeline</div>
    <div id="side-timeline-slot"></div>
  </div>
</div>

</div>

<script>
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

const FLOURS = {
  neo:[
    {id:'pizzeria',label:'Caputo Pizzeria (red)',protein:'12.5%',w:'W260',hydMin:58,hydMax:70,hydDef:63,info:'The Neapolitan standard. Balanced strength for 24\u201348hr ferments \u2014 the safe default for most home ovens and the Gozney.'},
    {id:'nuvola',label:'Caputo Nuvola',protein:'12.5%',w:'W270\u2013280',hydMin:65,hydMax:78,hydDef:70,info:'Bred for very high hydration and an open, airy crumb. More extensible than Pizzeria \u2014 handle gently.'},
    {id:'saccorosso',label:'Caputo Saccorosso (blue)',protein:'13%',w:'W300\u2013320',hydMin:60,hydMax:72,hydDef:63,info:'Stronger gluten network \u2014 built for long ferments (48\u201372hr+) and higher-temperature bakes.'},
    {id:'cuoco',label:'Caputo Cuoco',protein:'13%',w:'W300',hydMin:60,hydMax:70,hydDef:62,info:'General-purpose strong 00 \u2014 equally at home in pasta as pizza. A solid all-rounder if buying one bag.'},
    {id:'5stagioni',label:'Le 5 Stagioni Napoletana',protein:'12.5%',w:'W260\u2013280',hydMin:58,hydMax:68,hydDef:62,info:'A common, more affordable Caputo alternative in the UK \u2014 similar behaviour to Pizzeria.'},
    {id:'polselli',label:'Polselli Classica',protein:'12.5%',w:'W260\u2013280',hydMin:60,hydMax:68,hydDef:63,info:'Versatile Italian 00, close to Caputo Pizzeria \u2014 less widely stocked outside specialist shops.'},
    {id:'marino',label:'Mulino Marino Tipo 00',protein:'11.5%',w:'W220\u2013260',hydMin:55,hydMax:65,hydDef:60,info:'Stoneground, more character and flavour, but lower strength \u2014 best kept to shorter ferments.'}
  ],
  ny:[
    {id:'strong-generic',label:'Strong white bread flour (generic)',protein:'12\u201313%',w:'\u2014',hydMin:55,hydMax:65,hydDef:58,info:'The everyday UK supermarket standard \u2014 Tesco / Sainsbury\u2019s / ASDA own-label all sit in this band.'},
    {id:'allinsons',label:'Allinson\u2019s Strong White',protein:'13%',w:'\u2014',hydMin:55,hydMax:65,hydDef:58,info:'The most common named bread flour on UK shelves \u2014 reliable and consistent batch to batch.'},
    {id:'doves',label:'Doves Farm Strong White',protein:'13%',w:'\u2014',hydMin:55,hydMax:67,hydDef:60,info:'Organic-leaning with slightly better water absorption than most own-label \u2014 works well with a poolish too.'},
    {id:'marriages',label:'Marriage\u2019s Strong White',protein:'12.5%',w:'\u2014',hydMin:55,hydMax:65,hydDef:58,info:'A UK milling staple, similar to Doves Farm \u2014 a good stocked alternative if one\u2019s out.'},
    {id:'canadian',label:'Canadian Very Strong (e.g. Waitrose)',protein:'14.9%',w:'W350+',hydMin:58,hydMax:68,hydDef:60,info:'Very high protein \u2014 technically more bread than pizza flour, but works well blended down for extra chew.'},
    {id:'polselli-super',label:'Polselli Super',protein:'13.5%',w:'W320\u2013340',hydMin:62,hydMax:72,hydDef:65,info:'Strong Italian option for very long, high-hydration NY-style ferments (48\u201396hr).'}
  ],
  focaccia:[
    {id:'foc-strong',label:'Strong white bread flour',protein:'12\u201313%',w:'\u2014',hydMin:70,hydMax:90,hydDef:80,info:'The standard focaccia base \u2014 its strength holds the very high hydration this dough needs.'},
    {id:'foc-doves',label:'Doves Farm Strong White',protein:'13%',w:'\u2014',hydMin:72,hydMax:88,hydDef:80,info:'A step up in absorption over generic bread flour \u2014 handles the wet dough a little more predictably.'},
    {id:'tipo0',label:'Tipo 0 flour',protein:'12%',w:'\u2014',hydMin:70,hydMax:85,hydDef:78,info:'Slightly less refined than 00, more character and bran \u2014 traditional in Ligurian focaccia.'},
    {id:'foc-manitoba',label:'Manitoba blend base',protein:'14.5%',w:'W340\u2013400',hydMin:75,hydMax:90,hydDef:82,info:'A pre-blended high-protein base for very long (48hr+) cold bulk ferments with maximum oven spring.'}

const MANITOBA_INFO = 'Manitoba is a very high-protein Canadian-wheat flour (14\u201315%), almost never used alone. Blending 10\u201330% into a base flour boosts gluten strength, letting the dough handle longer ferments and higher hydration without collapsing \u2014 useful for 48hr+ cold ferments.';

const POOLISH_INFO = 'Poolish is a wet pre-ferment \u2014 equal parts flour and water plus a trace of yeast, left to ferment for hours before it\u2019s mixed into the final dough. Because it ferments slowly over a long time it needs very little yeast, and that slow fermentation is what builds real flavour \u2014 the longer it goes, the more complex and slightly tangy the crust tastes. It also improves extensibility, making the dough easier to stretch thin without tearing.';

const BRINE_INFO = 'The oil-and-water brine is whisked together just before baking, then poured over the dough as you press in the dimples with your fingertips. In the oven, the water flashes to steam and helps crisp the base and edges, while the oil fries the surface as it bakes \u2014 that combination is what gives focaccia its glossy, slightly crisp top instead of a dry crust. It also carries the salt evenly into every dimple rather than sitting on the surface.';

const FOLD_INFO = 'High-hydration dough like this is too wet to knead by hand, so it\u2019s strengthened with stretch-and-folds instead. Wet one hand, reach under one side of the dough in the bowl, stretch it upward, and fold it over the middle \u2014 turn the bowl a quarter turn and repeat on all four sides. That\u2019s one set. Doing 3 sets, spaced out over the first hour of bulk fermentation, builds a gluten network gently, trapping the gas bubbles that give focaccia its open, airy crumb without ever needing to knead it on a bench.';

function fmt(v){
  if(v<1)  return v.toFixed(2)+'g';
  if(v<10) return v.toFixed(1)+'g';
  return Math.round(v)+'g';
}

function pizzaSize(g){
  if(g<=220) return '10″';
  if(g<=250) return '11″';
  if(g<=290) return '12″';
  if(g<=310) return '13″';
  return '14″';
}

function manitobaPct(){
  if(style==='neo') return 0;
  return parseInt(document.getElementById('manitoba').value)||0;
}

function calcDough(){
  const balls    =parseInt(document.getElementById('balls').value);
  const weight   =parseInt(document.getElementById('weight').value);
  const hydration=parseInt(document.getElementById('hydration').value)/100;
  const totalDough=style==='focaccia'?(TRAY_SIZES.find(t=>t.id===traySizeId)?.doughRec||900):balls*weight;

  if(style==='neo'){
    const totalFlour  =totalDough/(1+hydration+0.024);
    const totalWater  =totalFlour*hydration;
    const salt        =totalFlour*0.024;
    const poolishFlour=totalFlour*0.5;
    const poolishWater=poolishFlour;
    const finalFlour  =totalFlour-poolishFlour;
    const finalWater  =totalWater-poolishWater;
    const yeast       =poolishFlour*YEAST_RATES[fermentHours].rate;
    return{totalDough,totalFlour,totalWater,salt,poolishFlour,poolishWater,finalFlour,finalWater,yeast};
  } else if(style==='ny'){
    const totalFlour=totalDough/(1+hydration+0.02+0.02+0.01);
    const totalWater=totalFlour*hydration;
    const salt =totalFlour*0.02;
    const oil  =totalFlour*0.02;
    const sugar=totalFlour*0.01;
    const yeast=totalFlour*YEAST_RATES[fermentHours].rate;
    return{totalDough,totalFlour,totalWater,salt,oil,sugar,yeast};
  } else {
    const totalFlour=totalDough/(1+hydration+0.025+0.05);
    const totalWater=totalFlour*hydration;
    const salt=totalFlour*0.025;
    const oil =totalFlour*0.05;
    const yeast=totalFlour*YEAST_RATES[fermentHours].rate;
    return{totalDough,totalFlour,totalWater,salt,oil,yeast};
  }
}

function flourRows(amount,flourName){
  const pct=manitobaPct();
  if(pct>0){
    const base=amount*(1-pct/100);
    const man=amount*(pct/100);
    return `<div class="row"><span class="name">${flourName} (${100-pct}%)</span><span class="amount">${fmt(base)}</span></div>
            <div class="row"><span class="name">Manitoba blend (${pct}%) <span class="diff-tag">boost</span></span><span class="amount">${fmt(man)}</span></div>`;
  }
  return `<div class="row"><span class="name">${flourName}</span><span class="amount">${fmt(amount)}</span></div>`;
}

        <div class="event teal">
          <div class="event-time">+10 min</div>
          <div class="event-body"><div class="event-title">Fold & bench rest</div><div class="event-sub">10–15 folds · shape into ball · cover · 30 min rest</div></div>
        </div>
        <div class="event teal">
          <div class="event-time">+40 min</div>
          <div class="event-body"><div class="event-title">Divide & ball up</div><div class="event-sub">Scale into ${document.getElementById('weight').value}g pieces · tight ball technique · into fridge</div></div>
        </div>
        <div class="proof-bar"><span>Ball cold proof begins</span><span class="hours">~${ballProofHrs} hr cold proof</span></div>
      </div>
    </div>
    <div class="day-block">
      <div class="day-label">${dayName(cookDate)} — Bake day</div>
      <div class="events">
        <div class="event blue">
          <div class="event-time">${fmt12(pullHour,cm)}</div>
          <div class="event-body"><div class="event-title">Pull balls from fridge</div><div class="event-sub">3 hours room temp rest — don't rush · if hot day check at 2.5 hrs</div></div>
        </div>
        <div class="event fire">
          <div class="event-time">${fmt12(ovenHour,cm)}</div>
          <div class="event-body"><div class="event-title">Light the Gozney</div><div class="event-sub">Target stone temp 420–450°C · allow 45–60 min to heat through</div></div>
        </div>
        <div class="event fire">
          <div class="event-time">${fmt12(ch,cm)}</div>
          <div class="event-body"><div class="event-title">Cook</div><div class="event-sub">50/50 semolina+00 on peel · stretch to ${pizzaSize(parseInt(document.getElementById('weight').value))} · ~75 sec · basil & oil after</div></div>
        </div>
      </div>
    </div>`;
  } else if(style==='ny'){
    const mixDaysBack=Math.round(fermentHours/24);
    const mixDate=addDays(cookDate,-mixDaysBack);
    const restHour=ch-2;

    html+=`
    <div class="day-block">
      <div class="day-label">${dayName(mixDate)} — Mix day</div>
      <div class="events">
        <div class="event red">
          <div class="event-time">Evening</div>
          <div class="event-body"><div class="event-title">Mix straight dough</div><div class="event-sub">All ingredients in one go · 8 min mixer · 30 min bench rest · ball up · into fridge</div></div>
        </div>
        <div class="proof-bar"><span>Cold proof begins</span><span class="hours">${fermentHours} hr in fridge</span></div>
      </div>
    </div>
    <div class="day-block">
      <div class="day-label">${dayName(cookDate)} — Bake day</div>
      <div class="events">
        <div class="event blue">
          <div class="event-time">${fmt12(restHour,cm)}</div>
          <div class="event-body"><div class="event-title">Pull balls from fridge</div><div class="event-sub">2 hours room temp rest before stretching</div></div>
        </div>
        <div class="event fire">
          <div class="event-time">${fmt12(ovenHour,cm)}</div>
          <div class="event-body"><div class="event-title">Light the Gozney</div><div class="event-sub">Target stone temp 280–320°C · low flame · allow 45–60 min</div></div>
        </div>
        <div class="event fire">
          <div class="event-time">${fmt12(ch,cm)}</div>
          <div class="event-body"><div class="event-title">Cook</div><div class="event-sub">Stretch thin to ${pizzaSize(parseInt(document.getElementById('weight').value))} · 4–6 min · rotate halfway · low moisture mozz should be golden</div></div>
        </div>
      </div>
    </div>`;
  } else {
    const mixDaysBack=Math.round(fermentHours/24);
    const mixDate=addDays(cookDate,-mixDaysBack);
    const trayHour=ch-3;

    html+=`
    <div class="day-block">
      <div class="day-label">${dayName(mixDate)} — Mix day</div>
      <div class="events">
        <div class="event amber">
          <div class="event-time">Evening</div>
          <div class="event-body"><div class="event-title">Mix straight dough</div><div class="event-sub">6 min mixer · 3 folds over the first hour · into fridge</div></div>
        </div>
        <div class="proof-bar"><span>Bulk ferment begins</span><span class="hours">${fermentHours} hr in fridge</span></div>
      </div>
    </div>
    <div class="day-block">
      <div class="day-label">${dayName(cookDate)} — Bake day</div>
      <div class="events">
        <div class="event blue">
          <div class="event-time">${fmt12(trayHour,cm)}</div>
          <div class="event-body"><div class="event-title">Turn into oiled tray</div><div class="event-sub">Stretch gently to fit · 1–2 hr room temp second rise</div></div>
        </div>
        <div class="event teal">
          <div class="event-time">${fmt12(ovenHour,cm)}</div>
          <div class="event-body"><div class="event-title">Dimple & top</div><div class="event-sub">Whisked oil-water brine into dimples · flaky salt · preheat oven to 220–230°C</div></div>
        </div>
        <div class="event fire">
          <div class="event-time">${fmt12(ch,cm)}</div>
          <div class="event-body"><div class="event-title">Bake</div><div class="event-sub">20–25 min until deep golden · rest 10 min before slicing</div></div>
        </div>
      </div>
    </div>`;
  }
  document.getElementById('timeline-content').innerHTML=html;
}

function update(){
  const balls    =parseInt(document.getElementById('balls').value);
  const weight   =parseInt(document.getElementById('weight').value);
  const hydration=parseInt(document.getElementById('hydration').value);
  document.getElementById('balls-val').textContent    =balls;
  document.getElementById('weight-val').textContent   =weight;
  document.getElementById('hydration-val').textContent=hydration;
  document.getElementById('yeast-note').textContent   =YEAST_RATES[fermentHours].note;
  document.getElementById('manitoba-val').textContent =manitobaPct();
  const d=calcDough();
  document.getElementById('total-dough').textContent=Math.round(d.totalDough)+'g';
  document.getElementById('total-flour').textContent=Math.round(d.totalFlour)+'g';
  document.getElementById('total-water').textContent=Math.round(d.totalWater)+'g';
  document.getElementById('size-label').textContent =style==='focaccia'?'Tray size':'Pizza size';
  document.getElementById('pizza-size').textContent =style==='focaccia'?trayLabel():pizzaSize(weight);
  document.getElementById('bake-info').textContent  =style==='neo'?'~75 sec':(style==='ny'?'4–6 min':'20–25 min');
  if(document.getElementById('flour-popover').classList.contains('open')) renderPopoverContent('flour-popover');
  renderRecipe(d);
  renderTimeline();
}

renderFlourSelect();
renderTraySelect();
renderBackground();
applyFlourConstraints();
layoutForWidth(wideQuery);
update();
</script>
</body>
</html>
